name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build -p img2omezarr --features "cli upload-s3" --bin img2omezarr

      - name: Build GUI
        run: cargo build -p img2omezarr-gui

      - name: Build GUI with S3
        run: cargo build -p img2omezarr-gui --features upload-s3

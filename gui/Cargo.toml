[package]
name = "img2omezarr-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop front-end for img2omezarr"
license = "MIT"

[features]
default = []
upload-s3 = ["img2omezarr/upload-s3"]

[dependencies]
anyhow = "1"
img2omezarr = { path = "..", features = ["core-bioformats"] }
rfd = "0.15"
slint = "1.17"

[build-dependencies]
slint-build = "1.17"

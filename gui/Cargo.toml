[package]
name = "img2omezarr-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop front-end for img2omezarr"
license = "MIT"

[features]
default = []
upload-s3 = ["img2omezarr/upload-s3"]

[dependencies]
anyhow = "1"
directories = "6"
img2omezarr = { path = "..", features = ["core-bioformats"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
slint = "1.17"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.17"
